name: Security Self-Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit & Pip-Audit
        run: |
          pip install bandit pip-audit

      - name: Run Bandit AST Scan
        run: |
          bandit -r apps/api/app -q || true

      - name: Run Pip-Audit Dependency Scan
        run: |
          pip-audit -r apps/api/requirements.txt || true
